<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>DTRC — Paper</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#252a31;font:16px/1.6 system-ui,sans-serif}
    main{max-width:620px;margin:18vh auto;padding:28px;text-align:center}h1{font-size:24px;line-height:1.35;font-weight:600}
    progress{width:min(320px,100%);height:5px;accent-color:#315b85}p{color:#686e77}a,button{color:#315b85}
    button{font:inherit;background:white;border:1px solid #dfe5eb;border-radius:20px;padding:7px 20px;cursor:pointer}
    #viewer{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #download{position:fixed;right:22px;bottom:18px;z-index:2;padding:8px 18px;border-radius:20px;background:#fff;box-shadow:0 1px 8px #0002;text-decoration:none;font-size:14px}
    [hidden]{display:none!important}
  </style>
  <script src="paper.js?v=20261006" defer></script>
</head>
<body>
  <main id="loading">
    <h1>Directed Temporal Representations<br>for Offline Visual Control</h1>
    <p id="status" role="status">Opening paper…</p>
    <progress id="progress" max="2" value="0" aria-label="Loading paper"></progress>
    <p><button id="retry" hidden>Try again</button></p>
    <p><a href="./">Back to project</a></p>
    <noscript><p>Please enable JavaScript to open the paper.</p></noscript>
  </main>
  <iframe id="viewer" title="DTRC paper" hidden></iframe>
  <a id="download" download="DTRC.pdf" hidden>Download PDF</a>
</body>
</html>
